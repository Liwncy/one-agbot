name: one-agbot

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0.36
    container_name: one_agbot_mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-one-agbot}
    ports:
      - "${MYSQL_PUBLISH_PORT:-23306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../script/sql/one_agbot_ai.sql:/docker-entrypoint-initdb.d/01-one_agbot_ai.sql:ro
      - ../script/sql/agbot_chat_message.sql:/docker-entrypoint-initdb.d/02-agbot_chat_message.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: always
    networks:
      - agbot_net

  redis:
    image: docker.m.daocloud.io/library/redis:7.2-alpine
    container_name: one_agbot_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PUBLISH_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - agbot_net

  snailai-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: snailai-server
    container_name: one_agbot_snailai
    ports:
      - "${SNAILAI_HTTP_PORT:-8900}:8900"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-one-agbot}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SNAIL_AI_CRYPTO_KEY: ${SNAIL_AI_CRYPTO_KEY}
      SNAIL_AI_CRYPTO_IV: ${SNAIL_AI_CRYPTO_IV}
    volumes:
      - ../upload:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8900/snail-ai/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always
    networks:
      - agbot_net

  boot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: boot
    container_name: one_agbot_boot
    ports:
      - "${BOOT_PORT:-8088}:8088"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SNAIL_AI_TOKEN: ${SNAIL_AI_TOKEN}
      SNAIL_AI_SERVER_HOST: snailai-server
      SNAIL_AI_SERVER_PORT: "18888"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-one-agbot}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      AGBOT_QUICK_LINE_BASE_URL: ${AGBOT_QUICK_LINE_BASE_URL:-}
      AGBOT_QUICK_LINE_API_KEY: ${AGBOT_QUICK_LINE_API_KEY:-}
      AGBOT_QUICK_LINE_MODEL: ${AGBOT_QUICK_LINE_MODEL:-}
      AGBOT_AGENT_HANDLE_POOL_SIZE: ${AGBOT_AGENT_HANDLE_POOL_SIZE:-8}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      snailai-server:
        condition: service_healthy
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: always
    networks:
      - agbot_net

volumes:
  mysql-data:
  redis-data:

networks:
  agbot_net:
    driver: bridge
