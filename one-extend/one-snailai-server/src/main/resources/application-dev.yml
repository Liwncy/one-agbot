spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 请先：CREATE DATABASE `one-agbot`; 再执行 script/sql/one_agbot_ai.sql
    url: jdbc:mysql://localhost:3306/one-agbot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
