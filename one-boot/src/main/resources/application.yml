server:
  port: 8088

spring:
  application:
    name: one-agbot
  config:
    # 本地密钥放 application-local.yml（已 gitignore），不存在则忽略
    import: optional:classpath:application-local.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      # Redis 已启用（Boot 4 为 DataRedis*）；群开关 / 会话映射可持久化
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 勿把真实密码提交进仓库；用环境变量或 application-local.yml
      password: ${REDIS_PASSWORD:}

agbot:
  kernel:
    # Golem 推送偶发延迟，过短容易误丢「已点名却不回」的消息
    max-message-age: 180s
    conversation-ttl: 30d
  agent:
    enabled: true
    default-agent-id: 1
    async-handled: false
  adapter:
    golem:
      # 取值对齐 xchatbot wrangler.toml（WECHAT_* / BOT_*）
      enabled: true
      api-base-url: https://wxbot.lwcorspro.dpdns.org
      webhook-token: ""
      bot-wechat-id: wxid_ahl9az25aljx22
      bot-wechat-name: 小聪明儿
      owner-wechat-id: wxid_5jfnhtqy74xr22
      allow-official: false
      # 群聊仅 @ / 点名机器人时才回复；私聊不受影响
      group-require-mention: true
      # 点名后同一用户免 @ 连续聊的窗口（0 关闭）
      group-activation-window: 60s
      # Redis 不可用时的群开关落盘文件
      group-gate-store-path: ./data/golem/group-disabled.txt

# 对齐 RuoYi-Vue-Plus ruoyi-admin application-dev.yml 的 snail-ai 段
# 网关需启用 Agent Client，否则 Server 报「没有可用的客户端实例」
snail-ai:
  enabled: true
  server:
    host: 127.0.0.1
    port: 18888
  app-id: "1"
  # 勿把真实 token 提交进仓库；用环境变量或 application-local.yml
  token: ${SNAIL_AI_TOKEN:}
  # 本进程 gRPC 端口（Server 通过此端口分发 Chat）
  port: 3${server.port}
  skill-temp-dir: ./data/snail-ai-agent/skills
  shell-temp-dir: ./data/snail-ai-agent/script/
  open-api:
    enabled: true
    web-port: 8900
    https: false
    prefix: snail-ai
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    chat-timeout-ms: 300000

logging:
  level:
    me.liwncy.agbot: INFO
    agbot.channel: INFO
