server:
  port: 8088

spring:
  application:
    name: one-agbot
  config:
    # 本地密钥放 application-local.yml（已 gitignore），不存在则忽略
    import: optional:classpath:application-local.yml
  autoconfigure:
    exclude:
      # Redis 已启用（Boot 4 为 DataRedis*）；群开关 / 会话映射可持久化
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:one-agbot}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 勿把真实密码提交进仓库；用环境变量或 application-local.yml
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

agbot:
  kernel:
    # Golem 推送偶发延迟，过短容易误丢「已点名却不回」的消息
    max-message-age: 180s
    conversation-ttl: 30d
  agent:
    enabled: true
    default-agent-id: 1
    # 角色会话：Hash agbot:roleplay:session，field=platform:account:group|user:id，无 TTL
    async-handled: false
    # 流式分片推送：段落/句号/图片链接边界各发一条（false 则仍 sync 整段回）
    stream-reply: true
    stream-min-chars: 16
    stream-timeout-ms: 300000
    # 触发时附带同会话最近 inbound（按 msg_time；≤0 关闭）
    context-window-minutes: 10
    context-max-messages: 15
    context-max-images: 3
  adapter:
    golem:
      # 取值对齐 xchatbot wrangler.toml（WECHAT_* / BOT_*）
      enabled: true
      api-base-url: https://wxbot.lwcorspro.dpdns.org
      webhook-token: ""
      bot-wechat-id: wxid_ahl9az25aljx22
      bot-wechat-name: 小聪明儿
      owner-wechat-id: wxid_5jfnhtqy74xr22
      allow-official: false
      # 默认不进 Agent：私聊本人 / 群主人发「开始」后才响应（避免自动注册）
      session-require-activation: true
      # Redis 不可用时的会话激活落盘
      session-active-store-path: ./data/golem/session-active.txt
      # 兼容旧语义；实际默认写在群配置里：点名 + 跟聊关（Redis key agbot:golem:group-settings）
      group-require-mention: true
      # 已废弃全局跟聊：跟聊秒数按群存在 group-settings.followUpSeconds（默认 0=关），指令「跟聊 60 / 跟聊 关」
      group-activation-window: 0s
      # Redis 不可用时的群开关落盘文件（session-require-activation=false 时使用）
      group-gate-store-path: ./data/golem/group-disabled.txt
      # 按群完整配置落盘（模式/跟聊秒数/规则）；Redis 可用时用 Hash agbot:golem:group-settings
      group-respond-store-path: ./data/golem/group-respond.txt
      # 入站媒体 PLATFORM → FILE/BASE64（CDN/消息下载）
      media-resolve-enabled: true
      media-store-path: ./data/golem/media
      media-prefer-form: FILE
      media-max-bytes: 20971520

# 对齐 RuoYi-Vue-Plus ruoyi-admin application-dev.yml 的 snail-ai 段
# 网关需启用 Agent Client，否则 Server 报「没有可用的客户端实例」
snail-ai:
  enabled: true
  server:
    host: 127.0.0.1
    port: 18888
  app-id: "1"
  # 勿把真实 token 提交进仓库；用环境变量或 application-local.yml
  token: ${SNAIL_AI_TOKEN:}
  # 本进程 gRPC 端口（Server 通过此端口分发 Chat）
  port: 3${server.port}
  skill-temp-dir: ./data/snail-ai-agent/skills
  shell-temp-dir: ./data/snail-ai-agent/script/
  open-api:
    enabled: true
    web-port: 8900
    https: false
    prefix: snail-ai
    connect-timeout-ms: 5000
    # 同步 OpenAPI 读超时；含 MCP 画图等慢工具时需大于 sai_mcp_server.timeout
    read-timeout-ms: 180000
    chat-timeout-ms: 300000

# 框架 MCP Server（SnailAI 再绑一条 sai_mcp_server，与 cf-mcp-tools 并列）
# Docker 内 SnailAI 填 http://boot:8088 ；本机联调填 http://127.0.0.1:8088
# 不要对公网暴露 /mcp
spring.ai.mcp:
  server:
    enabled: true
    protocol: STREAMABLE
    name: one-agbot
    version: 0.1.0
    type: SYNC
    annotation-scanner:
      enabled: true
    streamable-http:
      mcp-endpoint: /mcp

logging:
  level:
    me.liwncy.agbot: INFO
    agbot.channel: INFO
    agbot.agent: INFO
  # 落盘目录见 logback-spring.xml（默认 ./logs/one-agbot.log），可用 LOG_HOME 覆盖
